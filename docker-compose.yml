services:
  db:
    image: postgres:16-alpine
    container_name: hookrelay-db
    environment:
      POSTGRES_DB:       hookrelay-db
      POSTGRES_USER:     hookrelay-admin
      POSTGRES_PASSWORD: yourpassword
    volumes:
      - hookrelay-pg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hookrelay-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  hookrelay-pg-data:
